{% extends "base.html" %}
{% block title %}Budgets - WalletApp{% endblock %}
{% block body %}
<div class="app-shell">
    {% include "partials/sidebar.html" %}
    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h2>Budgets</h2>
            <div class="month-selector">
                <button onclick="changeBudgetMonth(-1)">‹</button>
                <span id="budgetMonthLabel"></span>
                <button onclick="changeBudgetMonth(1)">›</button>
            </div>
        </header>

        <div class="budget-summary" id="budgetSummary"></div>
        <div id="budgetsList" class="budgets-grid"></div>

        <!-- Add Budget Modal -->
        <div id="addBudgetModal" class="modal hidden">
            <div class="modal-overlay" onclick="closeModal('addBudgetModal')"></div>
            <div class="modal-content">
                <h3>Set Budget</h3>
                <div class="form-group">
                    <label>Category</label>
                    <select id="budgetCategory"></select>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="budgetAmount" placeholder="0.00" min="0" step="0.01">
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline" onclick="closeModal('addBudgetModal')">Cancel</button>
                    <button class="btn btn-primary" onclick="saveBudget()">Save</button>
                </div>
            </div>
        </div>

        <!-- Edit Budget Modal -->
        <div id="editBudgetModal" class="modal hidden">
            <div class="modal-overlay" onclick="closeModal('editBudgetModal')"></div>
            <div class="modal-content">
                <h3>Edit Budget</h3>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="editBudgetCategoryName" disabled style="background:var(--bg);color:var(--text-secondary)">
                </div>
                <div class="form-group">
                    <label>Amount (€)</label>
                    <input type="number" id="editBudgetAmount" placeholder="0.00" min="0" step="0.01">
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline" onclick="closeModal('editBudgetModal')">Cancel</button>
                    <button class="btn btn-primary" onclick="saveEditBudget()">Update</button>
                </div>
            </div>
        </div>
    </main>
</div>
<button class="fab" onclick="openAddBudgetModal()">+</button>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='budgets.js') }}"></script>
{% endblock %}
