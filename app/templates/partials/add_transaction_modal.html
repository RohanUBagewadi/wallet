<!-- Add/Edit Transaction Modal -->
<div id="addTransactionModal" class="modal hidden">
    <div class="modal-overlay" onclick="closeModal('addTransactionModal')"></div>
    <div class="modal-content">
        <h3 id="txModalTitle">Add Transaction</h3>
        <input type="hidden" id="editTxId">

        <div class="tx-type-toggle">
            <button class="tx-type-btn active" data-type="expense" onclick="setTxType('expense')">Expense</button>
            <button class="tx-type-btn" data-type="income" onclick="setTxType('income')">Income</button>
            <button class="tx-type-btn" data-type="emi" onclick="setTxType('emi')">🏦 EMI</button>
            <button class="tx-type-btn" data-type="transfer" onclick="setTxType('transfer')">↔ Transfer</button>
        </div>

        <!-- EMI fields -->
        <div id="txEmiFields" style="display:none">
            <div class="form-group">
                <label>Pay EMI From</label>
                <select id="txEmiFromWallet"></select>
            </div>
            <div class="form-group">
                <label>Loan Account</label>
                <select id="txEmiLoanWallet"></select>
            </div>
            <div class="form-group">
                <label>EMI Amount</label>
                <input type="number" id="txEmiAmount" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
            </div>
        </div>

        <!-- Regular fields (expense / income) -->
        <div id="txRegularFields">
            <div class="form-group">
                <label>Amount</label>
                <input type="number" id="txAmount" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="txCategory"></select>
            </div>
            <div class="form-group">
                <label>Wallet</label>
                <select id="txWallet" onchange="updateExchangeRateVisibility()"></select>
            </div>
            <div class="form-group" id="exchangeRateGroup" style="display:none">
                <label id="exchangeRateLabel">Exchange Rate (1 XXX = ? EUR)</label>
                <input type="number" id="txExchangeRate" placeholder="e.g. 0.011" min="0" step="0.0001" inputmode="decimal" value="1">
                <small style="color:var(--text-secondary)">How many EUR you get for 1 unit of the wallet currency</small>
            </div>
        </div>

        <!-- Transfer fields -->
        <div id="txTransferFields" style="display:none">
            <div class="form-group">
                <label>From Wallet</label>
                <select id="txFromWallet" onchange="updateTransferRate()"></select>
            </div>
            <div class="form-group">
                <label>Amount to Send</label>
                <input type="number" id="txFromAmount" placeholder="0.00" min="0" step="0.01" inputmode="decimal" oninput="updateToAmount()">
            </div>
            <div class="form-group">
                <label>To Wallet</label>
                <select id="txToWallet" onchange="updateTransferRate()"></select>
            </div>
            <div class="form-group" id="transferRateGroup" style="display:none">
                <label id="transferRateLabel">Exchange Rate (1 FROM = ? TO)</label>
                <input type="number" id="txTransferRate" placeholder="e.g. 83.5" min="0" step="0.0001" inputmode="decimal" value="1" oninput="updateToAmount()">
                <small style="color:var(--text-secondary)">How many units of the destination currency you get per 1 unit of the source currency</small>
            </div>
            <div class="form-group" id="toAmountPreview" style="display:none">
                <label>Amount to Receive</label>
                <div id="toAmountValue" style="padding:10px;background:var(--bg);border-radius:var(--radius-sm);color:var(--primary);font-weight:600"></div>
            </div>
        </div>

        <!-- Common fields -->
        <div class="form-group">
            <label>Date</label>
            <input type="date" id="txDate">
        </div>
        <div class="form-group">
            <label>Note</label>
            <input type="text" id="txNote" placeholder="Optional note" maxlength="200">
        </div>

        <!-- Labels -->
        <div class="form-group" id="txLabelsGroup">
            <label style="display:flex;align-items:center;justify-content:space-between">
                Labels
                <button type="button" class="btn-add-label" onclick="showNewLabelInput()">+ New Label</button>
            </label>
            <div id="labelsContainer" class="labels-container"></div>
            <div id="newLabelRow" style="display:none" class="new-label-row">
                <input type="text" id="newLabelName" placeholder="Label name" maxlength="30">
                <input type="color" id="newLabelColor" value="#607D8B">
                <button type="button" class="btn btn-primary btn-sm" onclick="createLabel()">Add</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="hideNewLabelInput()">✕</button>
            </div>
        </div>

        <div class="modal-actions">
            <button class="btn btn-outline" onclick="closeModal('addTransactionModal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveTransaction()">Save</button>
        </div>
    </div>
</div>
